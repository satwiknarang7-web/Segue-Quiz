name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # There are no dependencies to install, so there is nothing to cache
      # and no lockfile to restore. The whole suite is Node's own test runner.
      - name: Run tests
        run: node --test

  deploy:
    name: Deploy to Render
    needs: test
    # Skipped outright when the secret is absent, rather than running and
    # exiting zero: a green "deployed" that deployed nothing is worse than
    # no result at all.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && secrets.RENDER_DEPLOY_HOOK_URL != ''
    runs-on: ubuntu-latest
    steps:
      # Render only opens a webhook of its own once its GitHub app is connected
      # to the repository. Until then this hook does the same job, and better:
      # a push that passes the tests deploys, one that fails them does not.
      - name: Trigger deploy
        run: |
          curl --fail --silent --show-error "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" > /dev/null
          echo "Render deploy triggered."
