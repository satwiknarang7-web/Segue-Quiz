name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # There are no dependencies to install, so there is nothing to cache
      # and no lockfile to restore. The whole suite is Node's own test runner.
      - name: Run tests
        run: node --test

  deploy:
    name: Deploy to Render
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # The secrets context is not available to a job-level `if`, but env is
    # available to a step-level one, so the check happens per step below.
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      # Render only opens a webhook of its own once its GitHub app is connected
      # to the repository. Until then this hook does the same job, and better:
      # a push that passes the tests deploys, one that fails them does not.
      - name: Trigger deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl --fail --silent --show-error "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render deploy triggered."

      # Without this the job would go green having done nothing, which reads
      # as "deployed". The annotation says plainly that it did not.
      - name: Report that no deploy happened
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo "::notice title=Nothing deployed::No RENDER_DEPLOY_HOOK_URL secret is set, so this push was not deployed. Connect the repository in Render, or add the secret."
