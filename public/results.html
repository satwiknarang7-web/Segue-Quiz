<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Results · SegueQuiz</title>
    <link rel="stylesheet" href="/css/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23042b56'/><path d='M5 8h18l-3.2 4.4H5z' fill='%23878787'/><path d='M23.6 6.6h4.6L12.9 27h-4.6z' fill='%23ffffff'/></svg>"
    />
    <style>
      .review-q {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 14px 16px;
        display: grid;
        gap: 8px;
      }

      .review-q__head {
        display: flex;
        gap: 10px;
        align-items: baseline;
      }

      .review-q__verdict {
        font-size: 0.78rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 999px;
        white-space: nowrap;
      }

      .review-q__verdict[data-state="correct"] {
        background: var(--success-soft);
        color: var(--success);
      }

      .review-q__verdict[data-state="wrong"] {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .review-q__verdict[data-state="blank"] {
        background: var(--bg-subtle);
        color: var(--text-faint);
      }

      .review-opt {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        font-size: 0.9rem;
        color: var(--text-muted);
        padding: 4px 0;
      }

      .review-opt[data-correct="true"] {
        color: var(--success);
        font-weight: 600;
      }

      .review-opt[data-chosen="true"][data-correct="false"] {
        color: var(--danger);
        font-weight: 600;
      }

      .review-opt__tag {
        font-size: 0.72rem;
        border: 1px solid currentColor;
        border-radius: 999px;
        padding: 0 6px;
        white-space: nowrap;
      }

      .breakdown {
        display: grid;
        gap: 14px;
      }

      .breakdown__item {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 13px 15px;
        display: grid;
        gap: 8px;
      }

      .breakdown__head {
        display: flex;
        gap: 10px;
        align-items: baseline;
      }

      .breakdown__text {
        font-weight: 600;
        flex: 1;
      }

      .option-bar {
        display: grid;
        grid-template-columns: 22px 1fr 46px;
        gap: 9px;
        align-items: center;
        font-size: 0.87rem;
      }

      .option-bar__track {
        height: 8px;
        border-radius: 999px;
        background: var(--bg-subtle);
        overflow: hidden;
      }

      .option-bar__fill {
        height: 100%;
        background: var(--border-strong);
        border-radius: 999px;
      }

      .option-bar--correct .option-bar__fill {
        background: var(--success);
      }

      .option-bar__label {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        font-size: 0.72rem;
        font-weight: 700;
        background: var(--bg-subtle);
        color: var(--text-muted);
      }

      .option-bar--correct .option-bar__label {
        background: var(--success-soft);
        color: var(--success);
      }

      /* A written answer sits where the option letter does, so both kinds of
         breakdown read the same way. It is given a share of the row rather
         than its natural width, so one long answer cannot squeeze the bars. */
      .review-figure {
        display: block;
        max-width: 100%;
        max-height: 220px;
        object-fit: contain;
        border-radius: var(--radius-sm);
        background: #fff;
        margin: 4px 0;
      }

      .given-answer {
        flex: 0 1 34%;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.85rem;
      }

      .winner-name {
        font-weight: 650;
      }

      .tie-note {
        font-size: 0.78rem;
        color: var(--text-faint);
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="/" aria-label="SegueQuiz home">
          <img class="brand__logo brand__logo--light" src="/img/segueit-logo.png" alt="SegueIT" />
          <img class="brand__logo brand__logo--dark" src="/img/segueit-logo-dark.png" alt="" aria-hidden="true" />
          <span class="brand__divider" aria-hidden="true"></span>
          <span class="brand__product">Quiz</span>
        </a>
        <span class="spacer"></span>
        <a class="button button--ghost" id="edit-link" href="#">Edit quiz</a>
        <a class="button button--ghost" id="csv-link" href="#">Export CSV</a>
        <button class="button button--danger" id="clear-results" type="button">Clear</button>
      </div>
    </header>

    <main class="page">
      <div class="page-heading">
        <div>
          <h1 id="quiz-title">Loading…</h1>
          <p id="quiz-meta"></p>
        </div>
        <span class="spacer"></span>
        <label class="switch">
          <input type="checkbox" id="auto-refresh" checked />
          <span>Auto refresh</span>
        </label>
      </div>

      <p class="notice notice--error" id="page-error" hidden></p>

      <div class="stat-grid" id="stats" style="margin-bottom: 22px"></div>

      <section class="card card--flush" style="margin-bottom: 22px">
        <div style="padding: 18px 20px 4px">
          <h2 style="font-size: 1.05rem">Leaderboard</h2>
          <p class="tie-note">
            Ranked by score. When scores tie, the faster time wins.
            Only you can see this page.
          </p>
        </div>
        <div class="table-wrap">
          <div class="row" style="margin-bottom: 14px">
            <input
              id="leaderboard-search"
              type="search"
              placeholder="Search participants"
              autocomplete="off"
              style="max-width: 280px"
              aria-label="Search participants"
            />
            <span class="meta" id="search-summary"></span>
          </div>

          <table>
            <thead>
              <tr>
                <th style="width: 62px">Rank</th>
                <th>Participant</th>
                <th class="numeric">Score</th>
                <th class="numeric">Correct</th>
                <th class="numeric">Time</th>
                <th>Submitted</th>
                <th style="width: 64px"><span class="sr-only">Review</span></th>
                <th style="width: 44px"><span class="sr-only">Remove</span></th>
              </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
          </table>
        </div>
        <div id="leaderboard-empty"></div>
      </section>

      <section class="card stack" id="breakdown-section">
        <div class="card__header"><h2>Question breakdown</h2></div>
        <div class="breakdown" id="breakdown"></div>
      </section>
    </main>

    <dialog id="review-dialog" aria-labelledby="review-title">
      <div class="dialog__body stack">
        <div class="row">
          <h2 id="review-title">Answers</h2>
          <span class="spacer"></span>
          <button class="button button--ghost button--small" type="button" id="review-close">
            Close
          </button>
        </div>
        <p class="meta" id="review-summary"></p>
        <div class="stack" id="review-questions"></div>
      </div>
    </dialog>

    <script type="module" src="/js/results.js"></script>
  </body>
</html>
