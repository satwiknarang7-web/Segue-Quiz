<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit quiz · SegueQuiz</title>
    <link rel="stylesheet" href="/css/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23042b56'/><path d='M5 8h18l-3.2 4.4H5z' fill='%23878787'/><path d='M23.6 6.6h4.6L12.9 27h-4.6z' fill='%23ffffff'/></svg>"
    />
    <style>
      .question {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 14px 16px;
        display: grid;
        gap: 10px;
        background: var(--bg-elevated);
      }

      .question__head {
        display: flex;
        gap: 10px;
        align-items: baseline;
      }

      .question__index {
        font-variant-numeric: tabular-nums;
        color: var(--text-faint);
        font-weight: 700;
        font-size: 0.85rem;
      }

      .question__text {
        font-weight: 600;
        flex: 1;
      }

      .answer-list {
        display: grid;
        gap: 5px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .answer {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 0.9rem;
        color: var(--text-muted);
      }

      .answer__marker {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 0.7rem;
        font-weight: 700;
        border: 1px solid var(--border-strong);
        flex: none;
      }

      .answer--correct {
        color: var(--success);
        font-weight: 600;
      }

      .answer--correct .answer__marker {
        background: var(--success-soft);
        border-color: var(--success);
        color: var(--success);
      }

      .option-row {
        display: flex;
        gap: 9px;
        align-items: center;
      }

      .option-row input[type="radio"] {
        width: 18px;
        height: 18px;
        accent-color: var(--success);
        flex: none;
        cursor: pointer;
      }

      .option-row .remove-option {
        flex: none;
      }

      .qr-panel {
        display: grid;
        gap: 12px;
        justify-items: center;
        text-align: center;
      }

      .qr-frame {
        background: #fff;
        border-radius: var(--radius-sm);
        padding: 10px;
        border: 1px solid var(--border);
        line-height: 0;
      }

      .qr-frame img {
        width: 100%;
        max-width: 240px;
        height: auto;
        display: block;
      }

      .join-url {
        font-family: var(--mono);
        font-size: 0.8rem;
        word-break: break-all;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="/" aria-label="SegueQuiz home">
          <img class="brand__logo brand__logo--light" src="/img/segueit-logo.png" alt="SegueIT" />
          <img class="brand__logo brand__logo--dark" src="/img/segueit-logo-dark.png" alt="" aria-hidden="true" />
          <span class="brand__divider" aria-hidden="true"></span>
          <span class="brand__product">Quiz</span>
        </a>
        <span class="spacer"></span>
        <!-- Hidden until the quiz loads, so it never flashes the wrong state. -->
        <button class="button button--ghost" id="publish-toggle" type="button" hidden></button>
        <a class="button button--ghost" id="results-link" href="#">Leaderboard</a>
      </div>
    </header>

    <main class="page">
      <div class="page-heading">
        <div>
          <h1 id="quiz-heading">Loading…</h1>
          <p id="quiz-subheading"></p>
        </div>
      </div>

      <p class="notice notice--error" id="page-error" hidden></p>

      <div class="split">
        <section class="card stack">
          <div class="card__header">
            <h2>Questions</h2>
            <span class="badge" id="question-count">0</span>
            <span class="spacer"></span>
            <button class="button button--small" type="button" id="add-question-button">
              Add question
            </button>
          </div>
          <div class="stack" id="question-list"></div>
        </section>

        <div class="stack">
          <section class="card stack">
            <div class="card__header"><h2>Share</h2></div>
            <div class="qr-panel">
              <div class="qr-frame">
                <img id="qr-image" alt="QR code linking to this quiz" />
              </div>
              <span class="code-chip" id="join-code">------</span>
              <span class="join-url" id="join-url"></span>
              <div class="row" style="justify-content: center">
                <button class="button button--ghost button--small" type="button" id="copy-link">
                  Copy link
                </button>
                <a class="button button--ghost button--small" id="download-qr" download>
                  Download QR
                </a>
              </div>
              <p class="meta" id="share-hint"></p>
            </div>
          </section>

          <section class="card stack">
            <div class="card__header"><h2>Settings</h2></div>

            <form class="stack" id="settings-form">
              <div class="field">
                <label for="setting-title">Title</label>
                <input id="setting-title" type="text" maxlength="120" required />
              </div>

              <div class="field">
                <label for="setting-description">Description</label>
                <textarea id="setting-description" maxlength="500"></textarea>
              </div>

              <div class="field">
                <span class="label">Time limit</span>
                <div class="duration-input">
                  <input id="setting-minutes" type="number" min="0" max="240" aria-label="Minutes" />
                  <span>min</span>
                  <input id="setting-seconds" type="number" min="0" max="59" aria-label="Seconds" />
                  <span>sec</span>
                </div>
              </div>

              <label class="switch">
                <input type="checkbox" id="setting-published" />
                <span>Open for taking</span>
              </label>

              <label class="switch">
                <input type="checkbox" id="setting-retakes" />
                <span>Allow more than one attempt per person</span>
              </label>

              <label class="switch">
                <input type="checkbox" id="setting-end-on-leave" />
                <span>End the attempt if a taker leaves the screen</span>
              </label>

              <p class="notice notice--error" id="settings-error" hidden></p>
              <button class="button button--block" type="submit" id="save-settings">Save settings</button>
            </form>
          </section>
        </div>
      </div>
    </main>

    <dialog id="question-dialog" aria-labelledby="question-dialog-title">
      <form method="dialog" id="question-form">
        <div class="dialog__body stack">
          <h2 id="question-dialog-title">Add question</h2>

          <div class="field">
            <label for="question-text">Question</label>
            <textarea id="question-text" maxlength="500" required
                      placeholder="What is the SI unit of force?"></textarea>
          </div>

          <div class="field">
            <span class="label">Answer options <span class="field__hint">(select the correct one)</span></span>
            <div class="stack stack--tight" id="option-rows"></div>
            <button class="button button--ghost button--small" type="button" id="add-option"
                    style="justify-self: start">
              Add option
            </button>
          </div>

          <div class="field">
            <label for="question-points">Points</label>
            <input id="question-points" type="number" min="1" max="100" value="1" style="width: 110px" />
          </div>

          <p class="notice notice--error" id="question-error" hidden></p>
        </div>

        <div class="dialog__footer">
          <button class="button button--ghost" type="button" id="cancel-question">Cancel</button>
          <button class="button" type="submit" id="save-question">Save question</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/js/editor.js"></script>
  </body>
</html>
